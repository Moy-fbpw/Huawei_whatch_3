<!doctype html><html><head><meta charset="utf-8"><style>
body { margin:0; padding:28px; background:#1b1c1f; font-family:'Avenir Next'; color:#ddd;
       display:grid; grid-template-columns:repeat(3, 300px); gap:26px 34px; }
figure { margin:0; text-align:center; }
.bisel { width:300px; height:300px; border-radius:50%; padding:14px; box-sizing:border-box;
         background:radial-gradient(circle, #555 0 60%, #222 72%, #0c0c0c 100%);
         box-shadow:0 6px 18px rgba(0,0,0,.6); }
.bisel img { width:100%; height:100%; border-radius:50%; display:block; }
figcaption { margin-top:10px; font-size:15px; letter-spacing:.5px; }
</style></head><body><figure><div class="bisel"><img src="01-negro.svg"></div><figcaption>Negro · Esmoquin</figcaption></figure>
<figure><div class="bisel"><img src="02-blanco-dorado.svg"></div><figcaption>Blanco y oro · Porcelana</figcaption></figure>
<figure><div class="bisel"><img src="03-blanco.svg"></div><figcaption>Blanco · Bauhaus</figcaption></figure>
<figure><div class="bisel"><img src="04-vino.svg"></div><figcaption>Vino · Burdeos fumé</figcaption></figure>
<figure><div class="bisel"><img src="05-verde-militar.svg"></div><figcaption>Verde militar · Campo</figcaption></figure>
<figure><div class="bisel"><img src="06-azul-cielo.svg"></div><figcaption>Azul · Rayos de sol</figcaption></figure>
<figure><div class="bisel"><img src="07-amarillo.svg"></div><figcaption>Amarillo · Ámbar</figcaption></figure>
<figure><div class="bisel"><img src="08-rojo-sangre.svg"></div><figcaption>Rojo sangre · Côtes de Genève</figcaption></figure>
<figure><div class="bisel"><img src="00-aod.svg"></div><figcaption>AOD (todas)</figcaption></figure></body></html>
